<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>User Create Account| PawHaven</title>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/common.css">
        <link rel="stylesheet" href="css/user.css">
    </head>
    <body class="signup-page">
        <main class="signup-layout">
            <section class="signup-visual" aria-label="PawHaven adoption message">
                <div class="visual-content">
                    
                    <div class="paw-mark" aria-hidden="true">🐾</div>
                    <blockquote>
                    "The moment they choose you is
                    the moment everything changes."
                    </blockquote>
                    <p class="quote-credit">PawHaven Adoption Team</p>
                </div>
            </section>
            <section class="signup-panel">
                <div class="signup-content">
                    <a href="index.html" class="brand" aria-label="PawHaven home">
                        <span class="brand-icon" aria-hidden="true">🐾</span>
                        <span>PawHaven</span>
                    </a>

                    <div class="signup-heading">
                        <h1>Create your account</h1>
                        <p>save favorites and track your adoption journey.</p>
                    </div>

                    <form class="signup-form" action="#" method="post">
                        <div class="form-group">
                            <label for="full-name">Full Name<span>*</span></label>
                            <input
                               type="text"
                               id="full-name"
                               name="full-name"
                               autocomplete="name"
                               required 
                            >
                        </div>

                        <div class="form-group">
                            <label for="email">Email Address<span>*</span></label>
                            <input
                               type="email"
                               id="email"
                               name="email"
                               autocomplete="email"
                               required 
                            >
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number<span>*</span></label>
                            <input
                               type="tel"
                               id="phone"
                               name="phone"
                               autocomplete="tel"
                               required
                            >   
                        </div>

                        <div class="form-group">
                            <label for="password">Password<span>*</span></label>
                            <input
                               type="password"
                               id="password"
                               name="password"
                               autocomplete="new-password"
                               minlength="8"
                               required
                            >   
                        </div>

                        <div class="form-group">
                            <label for="confirm-password">Confirm Password<span>*</span></label>
                            <input
                               type="password"
                               id="confirm-password"
                               name="confirm-password"
                               autocomplete="new-password"
                               minlength="8"
                               required
                            >   
                        </div>

                        <button type="submit" class="submit-btn">
                            Create account
                        </button>
                    </form>

                        <p class="signin-text">
                            Already have an account?
                            <a href="login.html">Sign in</a>
                        </p>
  
                </div>
            </section>
        </main>
    </body>
</html>
