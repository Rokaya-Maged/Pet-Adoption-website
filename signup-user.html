<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your PawHaven account and start your pet adoption journey.">

    <title>Create Account | PawHaven</title>

    <!-- Shared stylesheet -->
    <link rel="stylesheet" href="css/common.css">

    <!-- User pages stylesheet -->
    <link rel="stylesheet" href="css/user.css">
</head>

<body class="signup-page">

<main class="signup-layout">

    <!-- Left side: image and quote -->
    <section class="signup-visual" aria-label="Welcome to PawHaven">

        <div class="visual-content">

            <div class="paw-mark" aria-hidden="true">
                <img src="images/icons/paw.svg" alt="" class="paw-icon">
            </div>

            <blockquote>
                “The moment they choose you is the moment everything changes.”
            </blockquote>

            <p class="quote-credit">
                PawHaven Adoption Team
            </p>

        </div>

    </section>


    <!-- Right side: registration form -->
    <section class="signup-panel">

        <div class="signup-content">

            <!-- logo -->
            <a href="index.html" class="brand" aria-label="PawHaven home">

                    <span class="brand-icon" aria-hidden="true">
                        <img src="images/icons/paw.svg" alt="" class="paw-icon">
                    </span>

                <span>PawHaven</span>

            </a>

            <div class="signup-heading">

                <h1>Create your account</h1>

                <p>
                    Join PawHaven and take the first step towards finding your new best friend.
                </p>

            </div>


            <!-- Signup form -->
            <form class="signup-form" action="#" method="post">

                <div class="form-group">

                    <label for="full-name">
                        Full Name <span aria-hidden="true">*</span>
                    </label>

                    <input
                            type="text"
                            id="full-name"
                            name="fullName"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        Email Address <span aria-hidden="true">*</span>
                    </label>

                    <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@email.com"
                            autocomplete="email"
                            required
                    >

                </div>

                <div class="form-group">

                    <label for="phone">
                        Phone Number <span aria-hidden="true">*</span>
                    </label>

                    <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            autocomplete="tel"
                            required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password <span aria-hidden="true">*</span>
                    </label>

                    <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                    >

                    <small class="field-hint">
                        Use at least 8 characters.
                    </small>

                </div>

                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password <span aria-hidden="true">*</span>
                    </label>

                    <input
                            type="password"
                            id="confirm-password"
                            name="confirmPassword"
                            placeholder="Enter your password again"
                            autocomplete="new-password"
                            minlength="8"
                            required
                    >

                </div>

                <button type="submit" class="submit-btn">
                    Create account
                </button>

            </form>

            <p class="signin-text">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>

        </div>

    </section>

</main>

</body>
</html>
