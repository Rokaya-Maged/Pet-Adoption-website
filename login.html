<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawHaven | Login</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/account.css">
</head>

<body class="login-body">

    <!-- Main content -->
    <main class="login-page">

        <!-- Left section: Login Visual -->
        <section class="login-visual">

            <blockquote>

                <p>
                    "The moment they choose you is the moment
                    everything changes."
                </p>

            </blockquote>

            <cite>PawHaven Adoption Team</cite>

        </section>

        <!-- Right section: Login Content -->
        <section class="login-content">

            <!-- Logo -->
            <div class="login-logo header-logo">

                <span class="logo">
                    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="8" cy="8" r="2.5"></circle>
                        <circle cx="16" cy="8" r="2.5"></circle>
                        <circle cx="5" cy="14" r="2.2"></circle>
                        <circle cx="19" cy="14" r="2.2"></circle>
                        <path d="M8 19c1.2-4.7 6.8-4.7 8 0 .7 3-2 3-4 2.1C10 22 7.3 22 8 19Z"></path>
                    </svg>
                </span>

                <span class="logo-text">PawHaven</span>

            </div>

            <!-- Welcome Heading -->
            <div class="login-heading">

                <h1>Welcome Back!</h1>
                <p>Log in to continue your adoption journey.</p>

            </div>

            <!-- Login Form -->
            <form class="login-form">

                <!-- Username/Email Field -->
                <div class="form-group">

                    <label for="username">Email or Username</label>

                    <input type="text" id="username" name="username" placeholder="Enter your email or username"
                        required>

                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <input type="password" id="password" name="password" placeholder="Enter your password" required>

                </div>

                <!-- Forgot Password -->
                <div class="forget-password">

                    <a href="#">Forgot Password?</a>

                </div>

                <!-- Submit Button -->
                <button type="submit" class="login-button">
                    Log in
                </button>

            </form>

            <!-- Create Account Prompt -->
            <p class="signup-prompt">
                New to PawHaven?

                <a href="signup.html">Create an account</a>
            </p>

        </section>

    </main>




</body>

</html>
