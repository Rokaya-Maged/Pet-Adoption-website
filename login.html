<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PawHaven | Login</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/account.css">
    <link rel="stylesheet" href="css/user.css">
</head>

<body class="signup-page">

    <!-- Main content -->
    <main class="signup-layout">

        <!-- Left section: Login Visual -->
        <section class="signup-visual" aria-label="Welcome to PawHaven">

            <div class="visual-content">

                <div class="paw-mark" aria-hidden="true">
                    <img src="images/icons/paw.svg" alt="" class="paw-icon">
                </div>

                <blockquote>
                    “The moment they choose you is the moment everything changes.”
                </blockquote>

                <p class="quote-credit">
                    PawHaven Adoption Team
                </p>

            </div>

        </section>

        <!-- Right section: Login Content -->
        <section class="signup-panel">
            <div class="signup-content">

                <!-- Logo -->
                <a href="index.html" class="brand" aria-label="PawHaven home">
                    <span class="brand-icon" aria-hidden="true">
                        <img src="images/icons/paw.svg" alt="" class="paw-icon">
                    </span>

                    <span>PawHaven</span>
                </a>

                <!-- Welcome Heading -->
                <div class="signup-heading">

                    <h1>Welcome Back!</h1>
                    <p>Log in to continue your adoption journey.</p>

                </div>

                <!-- Login Form -->
                <form class="signup-form" action="index.html" method="get">

                    <!-- Username/Email Field -->
                    <div class="form-group">

                        <label for="username">
                            Email or Username <span aria-hidden="true">*</span>
                        </label>

                        <input type="text" id="username" name="username" placeholder="Enter your email or username"
                            required>

                    </div>

                    <!-- Password Field -->
                    <div class="form-group">
                        <label for="password">
                            Password <span aria-hidden="true">*</span>
                        </label>

                        <input type="password" id="password" name="password" placeholder="Enter your password" required>

                    </div>

                    <!-- Forgot Password -->
                    <div class="forget-password">

                        <a href="#">Forgot Password?</a>

                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="login-button">
                        Log in
                    </button>

                </form>

                <!-- Create Account Prompt -->
                <p class="signin-text">
                    New to PawHaven?

                    <a href="signup-user.html">Create an account</a>
                </p>
            </div>
        </section>

    </main>




</body>

</html>
